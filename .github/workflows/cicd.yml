name: CI/CD Eatzy Microservices

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never deploy two revisions of main at the same time.
concurrency:
  group: eatzy-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Run Java tests
        run: |
          chmod +x gradlew
          ./gradlew test --parallel --continue --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: |
            **/build/test-results/test/*.xml
            **/build/reports/tests/test/**
          if-no-files-found: warn
          retention-days: 14

      - name: Prepare Java artifacts for Docker
        run: ./gradlew prepareDockerArtifacts --parallel --no-daemon

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker images
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
        shell: bash
        run: |
          set -euo pipefail
          version="main-${GITHUB_SHA:0:7}"
          services=(
            eatzy-discovery-server eatzy-config-server eatzy-api-gateway
            eatzy-auth-service eatzy-restaurant-service eatzy-order-service
            eatzy-communication-service eatzy-cart-service eatzy-payment-service
            eatzy-interaction-service eatzy-system-config-service eatzy-ai-service
          )
          # Build every image successfully before publishing any image.
          for service in "${services[@]}"; do
            docker build -t "$DOCKERHUB_USER/$service:latest" \
              -t "$DOCKERHUB_USER/$service:$version" -f "$service/Dockerfile" .
          done
          for service in "${services[@]}"; do
            docker push "$DOCKERHUB_USER/$service:$version"
            docker push "$DOCKERHUB_USER/$service:latest"
          done

      - name: Copy production compose to server
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          source: docker-compose.prod.yml
          target: /home/${{ secrets.SERVER_USER }}/projects/eatzy-microservices
          overwrite: true

      - name: Deploy to server via SSH
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          envs: DOCKERHUB_USER
          command_timeout: 30m
          script: |
            set -eu
            cd "$HOME/projects/eatzy-microservices"
            # Production secrets and the signing keystore stay on the server.
            test -s .env
            docker compose -f docker-compose.prod.yml config --quiet
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --no-build --wait --wait-timeout 300
            curl --fail --silent --show-error --retry 12 --retry-delay 5 \
              --retry-all-errors --max-time 10 http://localhost:8080/actuator/health
            docker image prune -f
